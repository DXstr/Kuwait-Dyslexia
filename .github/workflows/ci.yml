name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install "jsonschema>=4.18"
      - run: python contracts/tools/validate_contracts.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip until ai/ is scaffolded
        if: ${{ hashFiles('ai/pyproject.toml') == '' }}
        run: echo "ai/pyproject.toml not found yet - nothing to test"
      - uses: actions/setup-python@v5
        if: ${{ hashFiles('ai/pyproject.toml') != '' }}
        with: { python-version: "3.11" }
      - name: Lint and test
        if: ${{ hashFiles('ai/pyproject.toml') != '' }}
        working-directory: ai
        run: |
          pip install -e ".[dev]"
          ruff check .
          pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Unit tests
        working-directory: web
        run: npm test
      - name: Build
        working-directory: web
        run: npm run build
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (including B11 Arabic report/PDF route)
        working-directory: web
        run: flock -x /tmp/basira-browser-tests.lock npm run test:e2e

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: supabase/package-lock.json
      - name: Install dependencies
        working-directory: supabase
        run: npm ci
      - name: Check generated contracts and TypeScript
        working-directory: supabase
        run: npm run typecheck
      - name: Install PostgreSQL client for local integration tests
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Start Supabase local stack
        working-directory: supabase
        run: flock -x /tmp/basira-supabase-tests.lock npm start
      - name: Reset local database with seed
        working-directory: supabase
        run: flock -x /tmp/basira-supabase-tests.lock npm run reset
      - name: Run pgTAP database tests
        working-directory: supabase
        run: flock -x /tmp/basira-supabase-tests.lock npm run test:db
      - name: Lint database functions
        working-directory: supabase
        run: flock -x /tmp/basira-supabase-tests.lock npx supabase db lint --local --level error --workdir ..
      - name: Run database tooling and cleanup unit tests
        working-directory: supabase
        run: npm run test:unit
      - name: Test live Storage deletion and approval policies
        working-directory: supabase
        run: flock -x /tmp/basira-supabase-tests.lock npm run test:integration
      - name: Stop Supabase local stack
        if: ${{ always() }}
        working-directory: supabase
        run: flock -x /tmp/basira-supabase-tests.lock npm run stop
