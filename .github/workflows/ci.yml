name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install "jsonschema>=4.18"
      - run: python contracts/tools/validate_contracts.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip until ai/ is scaffolded
        if: ${{ hashFiles('ai/pyproject.toml') == '' }}
        run: echo "ai/pyproject.toml not found yet - nothing to test"
      - uses: actions/setup-python@v5
        if: ${{ hashFiles('ai/pyproject.toml') != '' }}
        with: { python-version: "3.11" }
      - name: Lint and test
        if: ${{ hashFiles('ai/pyproject.toml') != '' }}
        working-directory: ai
        run: |
          pip install -e ".[dev]"
          ruff check .
          pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip until web/ is scaffolded
        if: ${{ hashFiles('web/package.json') == '' }}
        run: echo "web/package.json not found yet - nothing to test"
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('web/package.json') != '' }}
        with: { node-version: "22" }
      - name: Typecheck, test, build
        if: ${{ hashFiles('web/package.json') != '' }}
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test --if-present
          npm run build
