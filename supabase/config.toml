# Standalone Basira local stack. No hosted project is linked by this file.
project_id = "basira"

[api]
enabled = true
port = 54321
# Microsoft/Azure must use the localhost Auth callback in the local stack.
# Supabase CLI 3.0.0 supports this field and passes it to Auth/provider setup.
external_url = "http://localhost:54321"
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17
health_timeout = "3m"

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.pooler]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false
port = 54323

[local_smtp]
enabled = false
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"
# Exact frontend callback allowlist only; do not replace these with wildcards.
additional_redirect_urls = [
  "http://localhost:5173/auth/callback",
  "http://127.0.0.1:5173/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
enable_anonymous_sign_ins = false

# B4 OAuth providers are deliberately disabled until real provider registrations
# and secrets are supplied through the ignored repository-root .env file. These values
# are server-side Auth configuration, never VITE_* browser variables.
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
scopes = "openid email profile"
skip_nonce_check = false

[auth.external.azure]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_AZURE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_AZURE_SECRET)"
url = "https://login.microsoftonline.com/common"
scopes = "openid profile email"
skip_nonce_check = false

# Password/email, SMS, anonymous sign-in, and other non-B4 sign-in paths stay off.
[auth.email]
enabled = false

[auth.sms]
enabled = false

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[functions.audio-cleanup]
enabled = true
verify_jwt = false
entrypoint = "./functions/audio-cleanup/index.ts"

[analytics]
enabled = false
port = 54327

# Standard Docker stack in CI; opt in locally with SUPABASE_EXPERIMENTAL_STACK=1.
[experimental]
stack = false
