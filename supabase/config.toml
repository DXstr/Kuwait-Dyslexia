# Standalone Basira local stack. No hosted project is linked by this file.
project_id = "basira"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17
health_timeout = "3m"

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.pooler]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false
port = 54323

[local_smtp]
enabled = false
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
enable_anonymous_sign_ins = false

# B4 configures Google and Microsoft through Supabase Auth.
# No password/magic-link, SMS, anonymous, or proprietary login is enabled.
[auth.email]
enabled = false

[auth.sms]
enabled = false

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[functions.audio-cleanup]
enabled = true
verify_jwt = false
entrypoint = "./functions/audio-cleanup/index.ts"

[analytics]
enabled = false
port = 54327

# Standard Docker stack in CI; opt in locally with SUPABASE_EXPERIMENTAL_STACK=1.
[experimental]
stack = false
