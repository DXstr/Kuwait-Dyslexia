[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "basira-ai"
version = "0.1.0"
description = "Basira workstream A: dialect-aware Arabic reading scorer (stateless) and content pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "numpy>=1.26",
]

[project.optional-dependencies]
# heavy: only for running the real acoustic models (Colab, Docker image); CI does not install it
model = [
    "torch>=2.6",  # transformers refuses .bin weights on older torch (CVE-2025-32434)
    "transformers>=4.40,<5",
    "huggingface_hub>=0.23",
    "librosa>=0.10",
    "soundfile>=0.12",
]
# the HTTP service (ai/service); installed in the Docker image and in CI
service = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.9",
]
dev = [
    "basira-ai[service]",
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
    "jsonschema>=4.18",
    # pinned: the generated models are checked byte-for-byte, and the generator formats with black + isort
    "datamodel-code-generator==0.26.3",
    "black==26.10.1",
    "isort==5.13.2",
]

[tool.setuptools.packages.find]
include = ["basira_ai*", "service*"]

[tool.setuptools.package-data]
basira_ai = ["data/*.json", "data/stage0/*.json"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["basira_ai/contracts_gen/models.py", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
